<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thyroid Disease Prediction</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 960px; margin: 0 auto; padding: 20px; color: #222; }
    nav a { margin-right: 16px; font-weight: bold; text-decoration: none; color: #1f77b4; }
    table { border-collapse: collapse; margin: 12px 0; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px 12px; text-align: center; }
    th { background: #f0f4f8; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    img { max-width: 100%; height: auto; border: 1px solid #ddd; }
    .field { margin: 8px 0; }
    .result { background: #e8f5e9; padding: 14px; border-radius: 6px; margin: 16px 0; }
    .error { background: #fdecea; padding: 10px; border-radius: 6px; margin: 8px 0; }
    button { padding: 8px 20px; font-size: 16px; cursor: pointer; }
    input[type="number"] { padding: 5px; }
    small { color: #555; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'predictor:index' %}">Model Results</a>
    <a href="{% url 'predictor:predict' %}">Predict</a>
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
